# Stow → ~/.config/ai-usagebar/config.toml
# Cursor reads IDE login (state.vscdb). No API key here.

[ui]
primary = "cursor"

[anthropic]
enabled = false

[openai]
enabled = false

[zai]
enabled = false

[openrouter]
enabled = false

[cursor]
enabled = true

