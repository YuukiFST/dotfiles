# Compositor i3 — transparência uniforme (75%), sem blur
backend = "glx";
vsync = true;
use-damage = true;
detect-client-opacity = true;

blur-background = false;
blur-background-frame = false;
blur-background-fixed = false;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;
shadow-offset-x = -8;
shadow-offset-y = -8;

fading = false;

# 75% em todas as janelas; UI do sistema e apps de mídia ficam opacos.
rules = (
  { match = "class_g = 'i3bar' || class_g = 'Polybar' || class_g = 'Rofi' || class_g = 'copyq' || class_g = 'i3lock'"; opacity = 1.0; shadow = false; },
  { match = "window_type = 'dock' || window_type = 'desktop'"; opacity = 1.0; shadow = false; },
  { match = "class_g = 'com.mitchellh.ghostty'"; opacity = 0.75; },
  { match = "window_type != 'dock' && window_type != 'desktop' && class_g != 'com.mitchellh.ghostty' && ! _NET_WM_WINDOW_OPACITY@"; opacity = 0.75; },
  # Exceções depois da regra geral — no picom, a última regra que casa vence.
  { match = "class_g = 'loupe' || class_g = 'showtime'"; opacity = 1.0; },
  # BEGIN OPAQUE_GHOSTTY
# END OPAQUE_GHOSTTY
);
