# Compositor i3 — transparência uniforme (75%), sem blur
backend = "glx";
vsync = true;
use-damage = true;
detect-client-opacity = true;

blur-background = false;
blur-background-frame = false;
blur-background-fixed = false;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;
shadow-offset-x = -8;
shadow-offset-y = -8;

fading = false;

# Por padrão tudo opaco; só terminal (ghostty, incluindo herdr), barra e app de mídia têm transparência.
# No picom, a última regra que casa vence — ordem importa.
rules = (
  { match = "class_g = 'Rofi' || class_g = 'copyq' || class_g = 'i3lock'"; opacity = 1.0; shadow = false; },
  { match = "window_type = 'dock' || window_type = 'desktop'"; opacity = 1.0; shadow = false; },
  { match = "class_g = 'i3bar' || class_g = 'Polybar'"; opacity = 0.75; shadow = false; },
  { match = "class_g = 'com.mitchellh.ghostty'"; opacity = 0.75; },
  { match = "class_g = 'loupe' || class_g = 'showtime'"; opacity = 1.0; },
  # BEGIN OPAQUE_GHOSTTY
  { match = "class_g = 'com.mitchellh.ghostty' && name = 'btop ~'"; opacity = 1.0; },
  { match = "class_g = 'com.mitchellh.ghostty' && name = './run.sh  /m/O/P/P/kotodama-type'"; opacity = 1.0; },
  { match = "class_g = 'com.mitchellh.ghostty' && name = './run.sh /m/O/P/P/kotodama-type'"; opacity = 1.0; },
  # END OPAQUE_GHOSTTY
);
